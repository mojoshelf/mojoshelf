[workspace]
name = "mojoshelf-cli"
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

# Builds the shelf CLI as a conda package (recipe.yaml) so it can be
# published to the channel served at https://mojoshelf.org/channel and
# installed with `pixi global install`.
[package]
name = "mojoshelf"
version = "0.4.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
