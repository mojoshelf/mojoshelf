name: tins

on:
  push:
    branches: [main]
    paths: ["tins/**", ".github/workflows/tins.yml"]
  pull_request:
    paths: ["tins/**", ".github/workflows/tins.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: tins

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: tins/pixi.toml
      - run: pixi run check
