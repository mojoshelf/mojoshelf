name: release-cli

# Builds the mojoshelf CLI conda package for every supported platform,
# refreshes the static channel under crates/shelf-worker/public/channel,
# commits it to main, applies pending D1 migrations and deploys
# the Worker so https://mojoshelf.org/channel serves the new packages.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          run-install: false
      - run: pixi build
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.platform }}
          path: mojoshelf-*.conda
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: prefix-dev/setup-pixi@v0
        with:
          run-install: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Add packages to the channel and reindex
        run: |
          for p in linux-64 linux-aarch64 osx-arm64; do
            mkdir -p "crates/shelf-worker/public/channel/$p"
            cp dist/conda-$p/*.conda "crates/shelf-worker/public/channel/$p/"
          done
          pixi exec rattler-index fs crates/shelf-worker/public/channel
      - name: Commit channel update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/shelf-worker/public/channel
          git commit -m "CI: update conda channel (${GITHUB_REF_NAME})" || echo "channel unchanged"
          git push origin main
      # D1 migrations first: a Worker that selects a column the database
      # doesn't have yet takes the site down (OPERATIONS.md). `apply` is a
      # no-op when nothing is pending and only moves forwards.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set: the channel was committed but mojoshelf.org was not deployed (#39)"
            exit 1
          fi
          cd crates/shelf-worker
          npx -y wrangler@4 d1 migrations list mojoshelf --remote
          npx -y wrangler@4 d1 migrations apply mojoshelf --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install -q worker-build
          cd crates/shelf-worker && npx -y wrangler@4 deploy
      - name: Check the channel is served
        run: |
          for p in linux-64 linux-aarch64 osx-arm64; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://mojoshelf.org/channel/$p/repodata.json")
            echo "$p: $code"; [ "$code" = 200 ]
          done
