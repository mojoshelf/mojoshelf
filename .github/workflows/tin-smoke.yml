name: tin-smoke

# Consumer-path smoke test: for every tin on the shelf, on every platform,
# do exactly what a user does — install the shelf extension from the conda
# channel, `pixi shelf add <tin>`, and let pixi build it from source.
#
# The tin list is DISCOVERED from the registry API, so newly published tins
# are covered automatically; only exceptions need editing here. No secrets
# and no checkout: these jobs build third-party tin code and get nothing to
# leak.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Smoke only this tin (default: all)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tins: ${{ steps.list.outputs.tins }}
    steps:
      - id: list
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            TINS='["${{ inputs.only }}"]'
          else
            # Tins that are not pixi-consumable yet:
            SKIP='["browser-native"]'
            TINS=$(curl -sf https://mojoshelf.org/api/tins \
              | jq -c --argjson skip "$SKIP" '[.[] | select((.kind // "source") == "source") | .name | select(. as $n | $skip | index($n) | not)]')
          fi
          echo "tins=$TINS" >> "$GITHUB_OUTPUT"
          echo "discovered: $TINS"

  smoke:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        tin: ${{ fromJSON(needs.discover.outputs.tins) }}
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        # stable feeds the badge-bearing verification; nightly is the
        # early-warning signal (tin page + separate opt-in badge).
        channel: [stable, nightly]
        exclude:
          # pontoneer does not declare linux-aarch64 yet
          - { tin: pontoneer, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Matrix outputs collapse to the last writer per key — fine for a
    # best-effort compiler version, since every job on one channel solves
    # against the same repodata. Each job writes only its channel's key.
    outputs:
      compiler_stable: ${{ steps.compiler.outputs.stable }}
      compiler_nightly: ${{ steps.compiler.outputs.nightly }}
    steps:
      - name: Install pixi and the shelf extension
        run: |
          export PIXI_VERSION=v0.71.1
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" global install --channel https://mojoshelf.org/channel mojoshelf
      - name: Consume ${{ matrix.tin }}
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) P=linux-64 ;;
            ubuntu-24.04-arm) P=linux-aarch64 ;;
            *) P=osx-arm64 ;;
          esac
          case "${{ matrix.channel }}" in
            nightly) MODULAR=https://conda.modular.com/max-nightly ;;
            *) MODULAR=https://conda.modular.com/max ;;
          esac
          mkdir smoke && cd smoke
          printf '[workspace]\nname = "smoke"\npreview = ["pixi-build"]\nchannels = ["conda-forge", "%s", "https://repo.prefix.dev/modular-community"]\nplatforms = ["%s"]\n' "$MODULAR" "$P" > pixi.toml
          # pixi streams rattler build output only to a TTY; `script` fakes one
          # so failures show the actual compiler errors in the CI log.
          if [ "$RUNNER_OS" = "Linux" ]; then
            script -qec "pixi shelf add ${{ matrix.tin }}" /dev/null
            script -qec "pixi install" /dev/null
          else
            pixi shelf add "${{ matrix.tin }}"
            pixi install
          fi
          echo "OK: ${{ matrix.tin }} builds on $P"
      - name: Record the mojo-compiler version (best effort)
        id: compiler
        run: |
          V=$(cd smoke && pixi list mojo-compiler 2>/dev/null \
            | awk '$1 == "mojo-compiler" { print $2; exit }') || true
          echo "${{ matrix.channel }}=$V" >> "$GITHUB_OUTPUT"

  # Report each tin's outcome to the registry (shown on tin pages and in
  # `shelf info`). Needs only the jobs API and the SHELF_TOKEN secret — no
  # checkout, and it never runs third-party tin code.
  report:
    needs: [discover, smoke]
    if: always() && needs.smoke.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: POST results to mojoshelf.org/api/verify
        env:
          SHELF_TOKEN: ${{ secrets.SHELF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPILER_STABLE: ${{ needs.smoke.outputs.compiler_stable }}
          COMPILER_NIGHTLY: ${{ needs.smoke.outputs.compiler_nightly }}
        run: |
          if [ -z "$SHELF_TOKEN" ]; then
            echo "SHELF_TOKEN secret not set; skipping registry report"
            exit 0
          fi
          JOBS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")
          RESULTS=$(echo "$JOBS" | jq -c --arg cs "$COMPILER_STABLE" --arg cn "$COMPILER_NIGHTLY" '
            [.jobs[]
             | select(.name | startswith("smoke ("))
             | (.name | capture("^smoke \\((?<t>[^,]+), (?<os>[^,]+), (?<ch>[^,)]+)\\)")) as $m
             | {tin: $m.t, channel: $m.ch, ok: (.conclusion == "success")}]
            | group_by([.tin, .channel])
            | map({name: .[0].tin, channel: .[0].channel, ok: all(.[]; .ok)}
                  + (([$cs, $cn][if .[0].channel == "nightly" then 1 else 0 end]) as $c
                     | if $c == "" then {} else {compiler: $c} end))')
          echo "reporting: $RESULTS"
          curl -sf -X POST "https://mojoshelf.org/api/verify" \
            -H "Authorization: Bearer $SHELF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"results\": $RESULTS}"
