# Temporary: reproduce the lancedb-shim rattler build directly so its full
# build log streams into CI. Delete when resolved.
name: debug-lancedb
on: workflow_dispatch
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: |
          export PIXI_VERSION=v0.71.1
          curl -fsSL https://pixi.sh/install.sh | bash
          export PATH="$HOME/.pixi/bin:$PATH"
          git clone --depth 1 https://github.com/millfolio/lancedb.mojo.git
          cd lancedb.mojo/ffi
          pixi exec --spec rattler-build -- rattler-build build --recipe recipe.yaml --output-dir /tmp/out 2>&1 | tail -150
