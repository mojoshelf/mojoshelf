[package]
name = "mojoshelf"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "CLI for mojoshelf, the Mojo tin registry (pixi source dependencies or git submodules)"

[[bin]]
name = "shelf"
path = "src/main.rs"

# Same CLI, discovered by pixi as the `pixi shelf` subcommand; when invoked
# under this name it defaults to pixi mode (git source dependencies).
[[bin]]
name = "pixi-shelf"
path = "src/main.rs"

[dependencies]
shelf-core = { path = "../shelf-core" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
